<style>

<script>
var DAYS = ['Monday','Tuesday','Wednesday','Thursday','Friday'];
var DAY_SHORT = { Monday:'Mon', Tuesday:'Tue', Wednesday:'Wed', Thursday:'Thu', Friday:'Fri' };
var CLUTCH_DAYS = ['Tuesday','Wednesday','Friday']; // the grind days — lower goals, harder to show up for
var gtData = null, DAILY_GOALS = null, WEEKLY_GOAL = 22000000;
var sortCol = -1, sortAsc = false, currentWeekLabelShown = null;
var GOALS_PASSWORD = 'GT2026';
var API_BASE = 'https://mantledb.sh/v2/gtplayerdashboard-shared-state';

function doGoalsLogin(){
  var val = document.getElementById('loginInput').value.trim();
  document.getElementById('loginError').textContent = '';
  if (!val) return;
  if (val === GOALS_PASSWORD){
    sessionStorage.setItem('gtGoalsAuth', '1');
    unlockGoals();
    return;
  }
  if (gtData && gtData.idToPlayer){
    var playerName = gtData.idToPlayer[val] || gtData.idToPlayer[Number(val)];
    if (playerName){
      sessionStorage.setItem('gtGoalsAuth', '1');
      sessionStorage.setItem('gtGoalsPlayer', playerName);
      unlockGoals();
      return;
    }
  }
  if (!gtData) {
    document.getElementById('loginError').textContent = 'Data is still loading. Please wait and try again.';
    return;
  }
  document.getElementById('loginError').textContent = 'Invalid code. Please try again.';
  document.getElementById('loginInput').value = '';
  document.getElementById('loginInput').focus();
}

function unlockGoals(){
  document.getElementById('loginWrap').style.display = 'none';
  document.getElementById('pageArea').style.display = '';
  var gl = document.getElementById('goalsNavLink');
  if (gl) gl.style.display = '';
}

function fmtM(v){ return (v/1000000).toFixed(v % 1000000 === 0 ? 0 : 1) + 'M'; }
function fmtScore(v){ return v ? v.toLocaleString() : '0'; }
function escAttr(s){ return String(s || '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

var dayScoresCache = {};

// Should this day count towards the week? Only once its scores have been
// entered — a day whose data is still missing is neither hit nor missed, so a
// player who hit Mon-Thu shows 4/4 while Friday is unrecorded, not 4/5.
function dayHasData(weekLabel, day){
  if (!gtData || !gtData.dailyData) return false;
  var key = weekLabel + '|' + day;
  if (key in dayScoresCache) return dayScoresCache[key];
  var idx = gtData.dailyData.weekOrder.indexOf(weekLabel);
  var players = gtData.dailyData.players;
  var has = idx >= 0 && Object.keys(players).some(function(n){
    var scores = players[n][day];
    return scores && scores[idx] > 0;
  });
  dayScoresCache[key] = has;
  return has;
}

// Current goal-hit streak: consecutive goal-met days across pushing weeks,
// counting back from the most recent day with data. Resting weeks are
// skipped (they neither extend nor break the streak). A miss or absence breaks it.
function calcStreak(name){
  var dd = gtData.dailyData;
  var pd = dd.players[name];
  if (!pd) return 0;
  var np = gtData.notPushingWeeks || new Set();
  var timeline = [];
  dd.weekOrder.forEach(function(wk, wIdx){
    if (np.has(wk)) return;
    if (!joinedByWeek(name, wk)) return;
    DAYS.forEach(function(day){
      if (!dayHasData(wk, day)) return;
      timeline.push({ score: (pd[day] && pd[day][wIdx]) || 0, goal: getDailyGoal(day, wk, gtData.currentWeekLabel) });
    });
  });
  var streak = 0;
  for (var i = timeline.length - 1; i >= 0; i--){
    if (timeline[i].score >= timeline[i].goal) streak++;
    else break;
  }
  return streak;
}

// Current zero-score streak: consecutive recorded days scoring exactly 0,
// across pushing weeks, counting back from the most recent recorded day.
// Mirrors calcStreak's walk but breaks on any score above zero.
function calcZeroStreak(name){
  var dd = gtData.dailyData;
  var pd = dd.players[name];
  if (!pd) return 0;
  var np = gtData.notPushingWeeks || new Set();
  var timeline = [];
  dd.weekOrder.forEach(function(wk, wIdx){
    if (np.has(wk)) return;
    if (!joinedByWeek(name, wk)) return;
    DAYS.forEach(function(day){
      if (!dayHasData(wk, day)) return;
      timeline.push((pd[day] && pd[day][wIdx]) || 0);
    });
  });
  var streak = 0;
  for (var i = timeline.length - 1; i >= 0; i--){
    if (timeline[i] === 0) streak++;
    else break;
  }
  return streak;
}

function weekIdxOf(label){ return gtData.dailyData.weekOrder.indexOf(label); }

// Rank order: R1 is the lowest, R4/R5 is the highest active tier.
var RANK_ORDER = ['R1','R2','R3','R4/R5'];
var TOP_RANKS = ['R4','R5','R4/R5'];
function rankIndex(rank){
  var r = String(rank || '').trim().toUpperCase();
  if (TOP_RANKS.indexOf(r) >= 0) return 3;
  return RANK_ORDER.indexOf(rank);
}

function suggestRank(currentRank, hitDays, recordedDays, zeroStreak){
  // R4/R5 players (including separate R4/R5 entries) are above the active tiers and always hold.
  if (TOP_RANKS.indexOf(String(currentRank || '').trim().toUpperCase()) >= 0) return { rank: currentRank, action: 'hold' };
  var normCurrent = String(currentRank || '').trim().toUpperCase();
  var cIdx = rankIndex(currentRank);
  // Sustained inactivity always suggests demotion one tier down, regardless of
  // rank or this week's hit/recorded numbers \u2014 it overrides the normal weekly
  // threshold check below. R1 has nowhere lower to go, so it just holds there,
  // still carrying the Inactive flag (set separately by the caller).
  if ((zeroStreak || 0) >= 5) {
    if (normCurrent === 'R3') return { rank: 'R2', action: 'down' };
    if (normCurrent === 'R2') return { rank: 'R1', action: 'down' };
    if (normCurrent === 'R1') return { rank: 'R1', action: 'hold' };
  }
  if (recordedDays === 0) return { rank: currentRank || '\u2014', action: 'hold' };
  // Hitting 3 of 5 daily goals earns R3, scaled to the days actually recorded.
  var metThreshold = Math.max(1, Math.ceil(recordedDays * 3 / 5));
  // R1 is reserved for brand new and inactive players, so missing goals never
  // takes anyone below R2 on its own.
  var targetRank = hitDays >= metThreshold ? 'R3' : 'R2';
  // An R1 player is only suggested for promotion once they actually meet that
  // same threshold \u2014 otherwise every R1 with at least one recorded day would
  // auto-promote to R2 regardless of performance, defeating the point of R1
  // being the floor for brand new/inactive players.
  if (normCurrent === 'R1' && hitDays < metThreshold) {
    return { rank: 'R1', action: 'hold' };
  }
  if (targetRank === currentRank) return { rank: targetRank, action: 'hold' };
  var tIdx = rankIndex(targetRank);
  if (cIdx < 0) return { rank: targetRank, action: 'assign' };
  return { rank: targetRank, action: tIdx > cIdx ? 'up' : 'down' };
}

// True when the player was in the alliance for any part of the week. Someone who
// joined later has no scores that week and would otherwise be listed with an
// all-zero row and counted as a failed week.
function joinedByWeek(name, weekLabel){
  var p = gtData.players[name];
  if (!p || !p.joinDate) return true;
  var joined = parseDateMMDDYYYY(p.joinDate);
  var weekStart = parseWeekStartDate(weekLabel);
  if (!joined || !weekStart) return true;
  var weekEnd = new Date(weekStart);
  weekEnd.setDate(weekEnd.getDate() + 6);
  return joined <= weekEnd;
}

function inactiveBadge(s){
  return s.inactive ? ' <span class="inactive-badge">Inactive</span>' : '';
}

function buildWeekRows(weekLabel){
  var wIdx = weekIdxOf(weekLabel);
  var rosterRanks = gtData.rosterRanks || {};
  var rows = [];
  Object.keys(gtData.players).forEach(function(name){
    var pd = gtData.dailyData.players[name];
    if (!pd) return;
    if (!joinedByWeek(name, weekLabel)) return;
    var dayScores = {};
    var total = 0;
    DAYS.forEach(function(day){
      var s = (pd[day] && pd[day][wIdx]) || 0;
      dayScores[day] = s;
      total += s;
    });
    var clutch = CLUTCH_DAYS.every(function(day){
      // only judge clutch on days whose scores are in (fair to in-progress weeks)
      return !dayHasData(weekLabel, day) || dayScores[day] >= getDailyGoal(day, weekLabel, gtData.currentWeekLabel);
    }) && CLUTCH_DAYS.some(function(day){ return dayHasData(weekLabel, day) && dayScores[day] >= getDailyGoal(day, weekLabel, gtData.currentWeekLabel); });
    // Same Inactive rule as the Rank Shift table: R1-R3 only, 5+ day zero streak.
    var currentRank = (pd.rank ? pd.rank[wIdx] : null) || rosterRanks[name] || 'Unknown';
    var cRankIdx = rankIndex(currentRank);
    var inactive = calcZeroStreak(name) >= 5 && cRankIdx >= 0 && cRankIdx <= 2;
    rows.push({ name: name, days: dayScores, total: total, clutch: clutch, streak: calcStreak(name), inactive: inactive });
  });
  return rows;
}

function cellHtml(weekLabel, day, score){
  var goal = getDailyGoal(day, weekLabel, gtData.currentWeekLabel);
  var hasData = dayHasData(weekLabel, day);
  var mark, cls;
  if (!hasData && score === 0){ mark = '\u00b7'; cls = 'cell-zero'; }       // scores not entered yet
  else if (score >= goal){ mark = '\u2713'; cls = 'cell-hit'; }             // hit
  else if (score >= goal * 0.9){ mark = '\u25CB'; cls = 'cell-near'; }      // near miss (90%+)
  else if (score > 0){ mark = '\u2717'; cls = 'cell-miss'; }                // miss
  else { mark = '\u2014'; cls = 'cell-zero'; }                              // absent
  return '<td><span class="' + cls + '">' + mark + '</span><span class="cell-score">' + (score ? fmtScore(score) : '') + '</span></td>';
}

function renderWeek(weekLabel){
  currentWeekLabelShown = weekLabel;
  var np = gtData.notPushingWeeks || new Set();
  var isInProgress = weekLabel === gtData.currentWeekLabel;
  var rows = buildWeekRows(weekLabel);

  // Alliance summary — denominator: players with any score that week
  var activeRows = rows.filter(function(r){ return r.total > 0; });
  var denom = activeRows.length || 1;
  var sumCards = DAYS.map(function(day){
    if (!dayHasData(weekLabel, day)){
      return '<div class="sum-card"><div class="sum-label">' + DAY_SHORT[day] + '</div><div class="sum-goal">' + fmtM(getDailyGoal(day, weekLabel, gtData.currentWeekLabel)) + '</div><div class="sum-value" style="color:var(--dim)">\u2014</div><div class="sum-count">not yet</div></div>';
    }
    var hits = activeRows.filter(function(r){ return r.days[day] >= getDailyGoal(day, weekLabel, gtData.currentWeekLabel); }).length;
    var pct = Math.round(hits / denom * 100);
    var cls = pct >= 75 ? 'good' : pct >= 50 ? 'mid' : 'bad';
    return '<div class="sum-card"><div class="sum-label">' + DAY_SHORT[day] + '</div><div class="sum-goal">' + fmtM(getDailyGoal(day, weekLabel, gtData.currentWeekLabel)) + '</div><div class="sum-value ' + cls + '">' + pct + '%</div><div class="sum-count">' + hits + '/' + denom + ' hit</div></div>';
  }).join('');
  var wkHits = activeRows.filter(function(r){ return r.total >= WEEKLY_GOAL; }).length;
  var wkPct = Math.round(wkHits / denom * 100);
  var wkCls = wkPct >= 75 ? 'good' : wkPct >= 50 ? 'mid' : 'bad';
  sumCards += '<div class="sum-card weekly"><div class="sum-label">Weekly</div><div class="sum-goal">' + fmtM(WEEKLY_GOAL) + '</div><div class="sum-value ' + wkCls + '">' + (isInProgress ? '\u2014' : wkPct + '%') + '</div><div class="sum-count">' + (isInProgress ? 'in progress' : wkHits + '/' + denom + ' hit') + '</div></div>';

  // Sort
  rows.sort(function(a, b){
    if (sortCol === -1) return b.total - a.total;
    if (sortCol === 0) return sortAsc ? a.name.localeCompare(b.name, undefined, {sensitivity:'base'}) : b.name.localeCompare(a.name, undefined, {sensitivity:'base'});
    if (sortCol >= 1 && sortCol <= 5){ var d = DAYS[sortCol-1]; return sortAsc ? a.days[d]-b.days[d] : b.days[d]-a.days[d]; }
    if (sortCol === 6) return sortAsc ? a.total-b.total : b.total-a.total;
    if (sortCol === 7) return sortAsc ? a.streak-b.streak : b.streak-a.streak;
    if (sortCol === 8) return sortAsc ? (a.clutch?1:0)-(b.clutch?1:0) : (b.clutch?1:0)-(a.clutch?1:0);
    return 0;
  });

  var ths = '<th onclick="sortBy(0)">Player</th>' +
    DAYS.map(function(day, i){ return '<th onclick="sortBy(' + (i+1) + ')">' + DAY_SHORT[day] + '<span class="th-goal">' + fmtM(getDailyGoal(day, weekLabel, gtData.currentWeekLabel)) + '</span></th>'; }).join('') +
    '<th onclick="sortBy(6)">Week Total<span class="th-goal">' + fmtM(WEEKLY_GOAL) + '</span></th>' +
    '<th onclick="sortBy(7)">Streak<span class="th-goal">goal days</span></th>' +
    '<th class="clutch-col" onclick="sortBy(8)">Clutch<span class="th-goal">Tue+Wed+Fri</span></th>';

  var trs = rows.map(function(r){
    var enc = encodeURIComponent(r.name);
    var totalCls = isInProgress ? '' : (r.total >= WEEKLY_GOAL ? ' hit' : ' miss');
    return '<tr>' +
      '<td class="pname"><a href="gt_dashboard.html?player=' + enc + '">' + r.name + '</a>' + inactiveBadge(r) + '</td>' +
      DAYS.map(function(day){ return cellHtml(weekLabel, day, r.days[day]); }).join('') +
      '<td><span class="wk-total' + totalCls + '">' + fmtScore(r.total) + '</span></td>' +
      '<td><span class="streak' + (r.streak >= 5 ? ' fire' : '') + '">' + r.streak + (r.streak >= 5 ? ' \uD83D\uDD25' : '') + '</span></td>' +
      '<td>' + (r.clutch ? '<span class="clutch-badge">\u2605 CLUTCH</span>' : '') + '</td>' +
      '</tr>';
  }).join('');

  document.getElementById('weekSub').innerHTML = 'Week of ' + weekLabel +
    (isInProgress ? '<span class="in-progress-label">In Progress</span>' : '') +
    (np.has(weekLabel) ? ' <span style="color:var(--accent3)">(resting week — goals informational only)</span>' : '');

  document.getElementById('content').innerHTML =
    '<div class="rank-shifts-wrap"><h2>Rank Shift Suggestions</h2><p class="sub">R1 is the lowest rank, R4/R5 is the highest. Only days with scores entered are counted: hitting 3 of 5 daily goals (scaled to the days recorded) → R3, below that → R2. R1 is for brand new and inactive players only — an R1 player is only suggested for promotion once they meet that same 3-of-5 threshold. Any R1, R2, or R3 player who puts up a zero score for 5 consecutive recorded days is flagged <b style="color:#842029;background:#f8d7da;padding:1px 6px;border-radius:999px;">Inactive</b> and suggested for demotion one tier down (R1 just holds, having nowhere lower to go). R4, R5, and R4/R5 players are not included in promote/demote suggestions.</p><div id="rankShifts"><div class="rank-empty">Loading rank shifts…</div></div></div>' +
    '<div class="summary-grid">' + sumCards + '</div>' +
    '<div class="table-card"><table><thead><tr>' + ths + '</tr></thead><tbody>' + trs + '</tbody></table></div>' +
    '<div id="rankShiftsFull"></div>' +
    '<div class="legend">' +
    '<span><b class="cell-hit">\u2713</b> hit goal</span>' +
    '<span><b class="cell-near">\u25CB</b> near miss (90%+)</span>' +
    '<span><b class="cell-miss">\u2717</b> missed</span>' +
    '<span><b class="cell-zero">\u2014</b> no score</span>' +
    '<span><b class="streak">Streak</b> consecutive goal days (resting weeks skipped)</span>' +
    '<span><b style="color:var(--gold)">\u2605 Clutch</b> hit every grind-day goal (Tue 3M / Wed 4M / Fri 3M)</span>' +
    '</div>';
  renderRankShifts(weekLabel, rows);
}

function attachRankStatus(weekLabel){
  var checks = document.querySelectorAll('.rank-status-check');
  checks.forEach(function(cb){
    cb.addEventListener('change', function(){
      saveRankState(this.dataset.week, this.dataset.player, this.checked ? 'Done' : 'Pending');
    });
  });
  loadRankState(weekLabel);
}

function loadRankState(weekLabel){
  if (!API_BASE) return;
  fetch(API_BASE + '/state/' + encodeURIComponent(weekLabel))
    .then(function(r){ return r.ok ? r.json() : {}; })
    .then(function(states){
      if (!states || typeof states !== 'object') states = {};
      document.querySelectorAll('.rank-status-check').forEach(function(cb){
        if (cb.dataset.week === weekLabel && states[cb.dataset.player]) {
          cb.checked = states[cb.dataset.player] === 'Done';
        }
      });
    })
    .catch(function(e){ console.error('[GT] loadRankState failed:', e); });
}

function saveRankState(weekLabel, player, status){
  if (!API_BASE) return;
  var url = API_BASE + '/state/' + encodeURIComponent(weekLabel);
  fetch(url)
    .then(function(r){ return r.ok ? r.json() : {}; })
    .then(function(states){
      if (!states || typeof states !== 'object') states = {};
      states[player] = status;
      return fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(states)
      });
    })
    .catch(function(e){ console.error('[GT] saveRankState failed:', e); });
}

function renderRankShifts(weekLabel, rows){
  var container = document.getElementById('rankShifts');
  var fullContainer = document.getElementById('rankShiftsFull');
  if (!gtData || !gtData.rosterRanks) {
    container.innerHTML = '<div class="rank-empty">Roster rank data not available.</div>';
    if (fullContainer) fullContainer.innerHTML = '';
    return;
  }
  var rosterRanks = gtData.rosterRanks;
  var wIdx = weekIdxOf(weekLabel);
  var shifts = [];
  rows.forEach(function(r){
    var playerData = gtData.dailyData.players[r.name];
    var weeklyRank = playerData && playerData.rank ? playerData.rank[wIdx] : null;
    var currentRank = weeklyRank || rosterRanks[r.name] || 'Unknown';
    var recorded = 0, hit = 0, dayIcons = '';
    DAYS.forEach(function(day){
      if (!dayHasData(weekLabel, day)){
        dayIcons += '<span class="day-icon day-future">–</span>';
        return;
      }
      recorded++;
      if (r.days[day] >= getDailyGoal(day, weekLabel, gtData.currentWeekLabel)){
        hit++;
        dayIcons += '<span class="day-icon day-hit">★</span>';
      } else {
        dayIcons += '<span class="day-icon day-miss">✕</span>';
      }
    });
    var zeroStreak = calcZeroStreak(r.name);
    var suggestion = suggestRank(currentRank, hit, recorded, zeroStreak);
    // Inactive is an independent flag on top of whatever the normal
    // suggestion is (Hold/Promote/Demote) — it only applies to the active
    // grind tiers (R1-R3); R4/R5 stay excluded from rank suggestions entirely.
    var cRankIdx = rankIndex(currentRank);
    var inactive = zeroStreak >= 5 && cRankIdx >= 0 && cRankIdx <= 2;
    shifts.push({
      name: r.name,
      current: currentRank,
      suggested: suggestion.rank,
      hit: hit,
      recorded: recorded,
      dayIcons: dayIcons,
      action: suggestion.action,
      inactive: inactive
    });
  });
  function rankSortIndex(rank){
    var idx = rankIndex(rank);
    return idx < 0 ? 999 : idx;
  }
  shifts.sort(function(a, b){
    var ai = rankSortIndex(a.current);
    var bi = rankSortIndex(b.current);
    if (ai !== bi) return bi - ai; // R4/R5 first, then R3, R2, R1
    return a.name.localeCompare(b.name, undefined, {sensitivity:'base'});
  });

  function rowHtml(s){
    var cls, actionText;
    if (s.action === 'hold') { cls = 'rank-hold'; actionText = 'Hold'; }
    else if (s.action === 'up') { cls = 'rank-up'; actionText = 'Promote'; }
    else if (s.action === 'down') { cls = 'rank-down'; actionText = 'Demote'; }
    else { cls = 'rank-up'; actionText = 'Set'; }
    return '<tr><td class="pname">' + s.name + inactiveBadge(s) + '</td><td class="rank-current">' + s.current + '</td><td class="' + cls + '">' + s.suggested + '</td><td>' + s.hit + '/' + s.recorded + '</td><td class="' + cls + '">' + actionText + '</td></tr>';
  }

  function summaryActionText(s){
    if (s.action === 'up') return 'Promote';
    if (s.action === 'down') return 'Demote';
    if (s.action === 'assign') return rankIndex(s.suggested) >= 2 ? 'Promote' : 'Demote';
    return 'Hold';
  }

  function summaryRowHtml(s){
    return '<tr><td class="pname">' + s.name + inactiveBadge(s) + '</td><td class="day-icons">' + s.dayIcons + '</td><td>' + s.hit + '/' + s.recorded + '</td><td><input type="checkbox" class="rank-status-check" data-player="' + escAttr(s.name) + '" data-week="' + escAttr(weekLabel) + '" title="Done"></td></tr>';
  }

  function summaryTable(title, items, color){
    var html = '<div class="rank-summary-col">';
    html += '<h3 class="rank-sum-title" style="color:' + color + ';margin-top:16px;">' + title + '</h3>';
    if (!items.length){
      html += '<div class="rank-empty">None</div>';
    } else {
      html += '<table class="rank-table"><thead><tr><th>Player</th><th>Days</th><th>Goal Days</th><th>Done</th></tr></thead><tbody>' +
        items.map(summaryRowHtml).join('') + '</tbody></table>';
    }
    html += '</div>';
    return html;
  }

  var promotions = shifts.filter(function(s){ return s.action === 'up' || (s.action === 'assign' && rankIndex(s.suggested) >= 2); });
  var demotions  = shifts.filter(function(s){ return s.action === 'down' || (s.action === 'assign' && rankIndex(s.suggested) < 2); });
  var fullTable = '<h3 class="rank-sum-title" style="color:var(--gold);margin-top:24px;">All Players</h3><div class="rank-table-wrap"><table class="rank-table"><thead><tr><th>Player</th><th>Current Rank</th><th>Suggested Rank</th><th>Goal Days</th><th>Action</th></tr></thead><tbody>' +
    shifts.map(rowHtml).join('') + '</tbody></table></div>';

  container.innerHTML = '<div class="rank-shifts-summaries">' + summaryTable('Promote', promotions, 'var(--accent)') + summaryTable('Demote', demotions, 'var(--red)') + '</div>';
  if (fullContainer) fullContainer.innerHTML = fullTable;
  attachRankStatus(weekLabel);
}

function sortBy(col){
  if (sortCol === col) sortAsc = !sortAsc;
  else { sortCol = col; sortAsc = false; }
  renderWeek(currentWeekLabelShown);
}

var lastLoadTime = 0;
var STALE_MS = 5 * 60 * 1000;

async function init(keepWeek){
  try {
    gtData = await loadGTData();
    lastLoadTime = Date.now();
    dayScoresCache = {};
    DAILY_GOALS = gtData.DAILY_GOALS || { Monday:6000000, Tuesday:3000000, Wednesday:4000000, Thursday:8000000, Friday:3000000 };
    WEEKLY_GOAL = gtData.WEEKLY_GOAL || 22000000;

    // Week dropdown: newest first. Default = current in-progress week.
    var weeks = gtData.dailyData.weekOrder.slice().reverse();
    var defaultWeek = (gtData.currentWeekLabel && weeks.indexOf(gtData.currentWeekLabel) >= 0)
      ? gtData.currentWeekLabel
      : weeks[0];
    if (keepWeek && weeks.indexOf(keepWeek) >= 0) defaultWeek = keepWeek;
    var sel = document.getElementById('weekSelect');
    sel.innerHTML = weeks.map(function(w){
      var tag = w === gtData.currentWeekLabel ? ' (in progress)' : '';
      return '<option value="' + w.replace(/"/g,'&quot;') + '"' + (w === defaultWeek ? ' selected' : '') + '>' + w + tag + '</option>';
    }).join('');
    renderWeek(defaultWeek);
  } catch(err){
    document.getElementById('content').innerHTML = '<div class="error-msg">' + err.message + '</div>';
    document.getElementById('weekSub').textContent = 'Failed to load';
  }
}
async function refreshData(){
  var btn = document.getElementById('refreshBtn');
  if (btn){ btn.disabled = true; btn.textContent = 'Refreshing...'; }
  await init(currentWeekLabelShown);
  if (btn){ btn.disabled = false; btn.textContent = 'Refresh'; }
}

window.addEventListener('DOMContentLoaded', function(){
  if (sessionStorage.getItem('gtGoalsAuth') === '1') unlockGoals();
  else document.getElementById('loginInput').focus();
  init(); // data loads in the background while the code is entered
});

// A tab left open (or restored from the back/forward cache) keeps showing the
// workbook as it was when the page first loaded; re-pull once it goes stale.
document.addEventListener('visibilitychange', function(){
  if (document.visibilityState === 'visible' && lastLoadTime && Date.now() - lastLoadTime > STALE_MS) {
    refreshData();
  }
});
window.addEventListener('pageshow', function(e){
  if (e.persisted) refreshData();
});
